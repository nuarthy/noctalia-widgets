# Separate Noctalia desktop widget: Card Image Converter.
id = "nuarthy/image-converter"
name = "Card Image Converter"
version = "1.0.4"
plugin_api = 43
author = "nuarthy"
license = "MIT"
icon = "image"
description = "Click to choose an image, then convert it to WebP, PNG, JPG or AVIF with ImageMagick or FFmpeg."
tags = ["desktop", "image", "converter"]
dependencies = []

[[desktop_widget]]
id = "widget"
entry = "widget.luau"

[[desktop_widget.setting]]
key = "converter_fallback_dir"
type = "string"
label_key = "settings.converter_fallback_dir.label"
description_key = "settings.converter_fallback_dir.description"
default = "~/Pictures/Converted"

[[desktop_widget.setting]]
key = "converter_width"
type = "int"
label_key = "settings.converter_width.label"
description_key = "settings.converter_width.description"
default = 255
min = 200
max = 600

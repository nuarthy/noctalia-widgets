# Desktop widgets ported from github.com/nuarthy/dms-widgets.
#
# One desktop-widget entry with a Mode setting, plus a shared weather service.
# Noctalia labels plugin desktop widgets with the plugin name, so separate
# entries would all read "Desktop Widgets" in the type picker; one mode-switched
# entry keeps a single picker row and per-instance settings.
#
# plugin_api = 43 keeps Noctalia 5.4 working. The media widget probes
# noctalia.mediaPlayer() (API 51) at runtime and falls back to playerctl on 5.4.
# Text shadow uses the same probe and is inactive on 5.4.

id = "nuarthy/noctalia-widgets"
name = "Desktop Widgets"
version = "1.0.1"
plugin_api = 43
author = "nuarthy"
license = "MIT"
icon = "layout-grid"
description = "Desktop widgets ported from dms-widgets: clock, weather, system, media, world clock, calendar and user card."
tags = ["desktop", "clock", "time", "media", "system"]
dependencies = []

# ── Shared weather source ────────────────────────────────────────────────────
[[setting]]
key = "weather_location"
type = "string"
label_key = "settings.weather_location.label"
description_key = "settings.weather_location.description"
default = ""

[[setting]]
key = "weather_units"
type = "select"
label_key = "settings.weather_units.label"
description_key = "settings.weather_units.description"
default = "metric"
options = [{ value = "metric", label_key = "settings.weather_units.options.metric" }, { value = "imperial", label_key = "settings.weather_units.options.imperial" }]

[[setting]]
key = "weather_refresh"
type = "int"
label_key = "settings.weather_refresh.label"
description_key = "settings.weather_refresh.description"
default = 15
min = 5
max = 120

# ── Desktop widget entry ─────────────────────────────────────────────────────
[[desktop_widget]]
id = "widget"
entry = "widget.luau"

  [[desktop_widget.setting]]
  key = "mode"
  type = "select"
  label_key = "settings.mode.label"
  description_key = "settings.mode.description"
  default = "clock"
  options = [{ value = "clock", label_key = "settings.mode.options.clock" }, { value = "weather", label_key = "settings.mode.options.weather" }, { value = "system", label_key = "settings.mode.options.system" }, { value = "media", label_key = "settings.mode.options.media" }, { value = "world_clock", label_key = "settings.mode.options.world_clock" }, { value = "calendar", label_key = "settings.mode.options.calendar" }, { value = "user_card", label_key = "settings.mode.options.user_card" }]

# ── Clock ──────────────────────────────────────────────────────────────────
  [[desktop_widget.setting]]
  key = "clock_style"
  type = "select"
  label_key = "settings.clock_style.label"
  description_key = "settings.clock_style.description"
  default = "digital"
  options = [{ value = "digital", label_key = "settings.clock_style.options.digital" }, { value = "stacked", label_key = "settings.clock_style.options.stacked" }, { value = "compact", label_key = "settings.clock_style.options.compact" }]
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_show_seconds"
  type = "bool"
  label_key = "settings.clock_show_seconds.label"
  description_key = "settings.clock_show_seconds.description"
  default = false
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_show_date"
  type = "bool"
  label_key = "settings.clock_show_date.label"
  description_key = "settings.clock_show_date.description"
  default = true
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_date_format"
  type = "string"
  label_key = "settings.clock_date_format.label"
  description_key = "settings.clock_date_format.description"
  default = "%a, %b %-d"
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_time_format"
  type = "string"
  label_key = "settings.clock_time_format.label"
  description_key = "settings.clock_time_format.description"
  default = ""
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_timezone"
  type = "string"
  label_key = "settings.clock_timezone.label"
  description_key = "settings.clock_timezone.description"
  default = ""
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_color"
  type = "color"
  label_key = "settings.clock_color.label"
  description_key = "settings.clock_color.description"
  default = "primary"
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_date_color"
  type = "color"
  label_key = "settings.clock_date_color.label"
  description_key = "settings.clock_date_color.description"
  default = "on_surface_variant"
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_shadow"
  type = "bool"
  label_key = "settings.clock_shadow.label"
  description_key = "settings.clock_shadow.description"
  default = false
  visible_when = { key = "mode", values = ["clock"] }

  [[desktop_widget.setting]]
  key = "clock_width"
  type = "int"
  label_key = "settings.clock_width.label"
  description_key = "settings.clock_width.description"
  default = 0
  min = 0
  max = 900
  visible_when = { key = "mode", values = ["clock"] }

